spring.application.name=demo
server.port=8080

# CONFIGURACIÓN DE BASE DE DATOS (H2 In-Memory - No MySQL needed)
spring.datasource.url=jdbc:h2:mem:db_boletos
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# CONFIGURACIÓN DE JPA / HIBERNATE

# 'update' hace que Hibernate cree o actualice las tablas automáticamente según tus clases Java
spring.jpa.hibernate.ddl-auto=update

# 'true' muestra en la consola de IntelliJ las consultas SQL que Hibernate ejecuta (muy útil para ver qué pasa)
spring.jpa.show-sql=true

# H2 Console (opcional - para ver la base de datos en el navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cargar datos de prueba automáticamente al iniciar la aplicación
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Configuración de Correo Electrónico (Gmail SMTP)
# Desactivado para pruebas - los correos se simulan en consola
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
