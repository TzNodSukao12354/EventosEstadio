<div class="container mt-4">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm mb-4 px-3">
    <a class="navbar-brand fw-bold" routerLink="/eventos">Sistema de Boletos</a>
    <div class="navbar-nav ms-auto align-items-center">
      <span class="nav-link disabled me-2">{{ authService.getUsername() }}</span>
      <a class="nav-link" routerLink="/mis-entradas" routerLinkActive="active">Mis Entradas</a>
      <a class="nav-link" *ngIf="authService.isAdmin()" routerLink="/admin" routerLinkActive="active">Admin</a>
      <button class="btn btn-outline-danger btn-sm ms-2" (click)="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </nav>

  <h2 class="text-center mb-4 fw-bold">Eventos Disponibles</h2>

  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center mt-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Buscando eventos...</p>
  </div>

  <!-- Grid de tarjetas -->
  <div class="row" *ngIf="!cargando">
    <div class="col-md-4 mb-4" *ngFor="let evento of eventos">
      <div class="card shadow-sm h-100 border-0">
        <img [src]="evento.urlImagen || 'https://via.placeholder.com/300x200?text=Evento'"
             class="card-img-top" alt="Imagen del evento" style="height: 200px; object-fit: cover;">

        <div class="card-body d-flex flex-column">
          <h5 class="card-title fw-bold">{{ evento.nombreEvento }}</h5>
          <p class="card-text text-muted mb-1">
            Fecha: {{ evento.fecha }} | Hora: {{ evento.hora }}
          </p>
          <p class="card-text text-muted mb-1">
            Tipo: {{ evento.tipoEvento | uppercase }}
          </p>

          <button class="btn btn-primary mt-auto w-100 fw-bold" (click)="abrirCompra(evento)">
            Comprar Entradas
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Si no hay eventos -->
  <div *ngIf="!cargando && eventos.length === 0" class="text-center mt-5">
    <p class="text-muted">No hay eventos disponibles.</p>
  </div>
</div>

<!-- Modal de compra -->
<app-comprar-entrada
  *ngIf="mostrarModal && eventoSeleccionado"
  [evento]="eventoSeleccionado"
></app-comprar-entrada>
