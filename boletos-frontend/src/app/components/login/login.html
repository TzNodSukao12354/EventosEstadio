<div class="login-container">
  <div class="login-card card shadow">
    <div class="card-body text-center">
      <h2 class="mb-2">Sistema de Boletos</h2>
      <p class="text-muted mb-4">Inicia sesión para continuar</p>

      <!-- Mensaje de error -->
      <div *ngIf="error" class="alert alert-danger" role="alert">
        {{ error }}
      </div>

      <form (ngSubmit)="iniciarSesion()">
        <div class="mb-3 text-start">
          <label for="username" class="form-label fw-bold">Usuario</label>
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Ingresa tu usuario"
            [(ngModel)]="username"
            name="username"
            required
          >
        </div>

        <div class="mb-3 text-start">
          <label for="password" class="form-label fw-bold">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Ingresa tu contraseña"
            [(ngModel)]="password"
            name="password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold mt-3" [disabled]="cargando">
          <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
          {{ cargando ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        </button>
      </form>

      <div class="mt-4 p-3 bg-light rounded">
        <p class="mb-1 small text-muted"><strong>Credenciales de prueba:</strong></p>
        <p class="mb-0 small text-muted">admin / admin123 (Administrador)</p>
        <p class="mb-0 small text-muted">user / user123 (Usuario)</p>
      </div>
    </div>
  </div>
</div>
